apiVersion: 1
groups:
  - orgId: 1
    name: model-serving-latency
    folder: Model Serving
    interval: 10s
    rules:
      - uid: high-latency
        title: High Latency
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: histogram_quantile(0.95, sum by (le) (rate(request_duration_bucket{path="/predict"}[5m]))) * 1000
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 100
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: warning
          team: model-serving
        annotations:
          summary: p95 /predict latency exceeds 100ms SLO
          description: p95 latency above 100ms for 2 minutes. Check load, TORCH_NUM_THREADS, and CPU limits.
