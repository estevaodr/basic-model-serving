services:
  app:
    image: basic-model-serving:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Benchmark tuning: TORCH_NUM_THREADS aligned with CPU limit (PERF-04 / Phase 1 D-04)
    environment:
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-2}
    cpus: "2.0"
    mem_limit: 2g
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3); exit(0 if r.status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  prometheus:
    image: prom/prometheus:v3.3.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/model-serving-overview.json
    depends_on:
      - prometheus

volumes:
  prometheus-data:
